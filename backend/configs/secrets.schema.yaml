# Secret file schema — defines required secret files, expected location,
# and minimum permissions for the local-demo / customer-template / production
# environments.
#
# Phase 1: skeleton. Phase 1 completion will add a CI lint step that
# verifies each secret file exists with the declared permissions and
# minimum length.

version: 1

secrets:
  session_secret:
    description: "Hash secret for opaque session tokens (SHA-256 of secret+token)."
    min_bytes: 32
    permissions_octal: "0o600"

  csrf_secret:
    description: "Hash secret for CSRF tokens (SHA-256 of secret+token)."
    min_bytes: 32
    permissions_octal: "0o600"

  audit_hmac_key:
    description: "HMAC-SHA256 key for audit chain integrity."
    min_bytes: 32
    permissions_octal: "0o600"

  audit_hmac_key_ring:
    description: "Optional JSON map of version->key for HMAC key rotation."
    required: false
    permissions_octal: "0o600"

  file_encryption_key:
    description: "URL-safe base64 encoded 32-byte AES-256-GCM key."
    min_bytes: 44  # base64 of 32 bytes is 44 chars
    permissions_octal: "0o600"

  file_encryption_key_ring:
    description: "Optional JSON map of version->base64-key for file key rotation."
    required: false
    permissions_octal: "0o600"
