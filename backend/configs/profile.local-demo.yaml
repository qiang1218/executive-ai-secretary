# Local demo environment profile
# Phase 1: skeleton only. Values will be sourced from Settings fields during migration.
# This profile is for one-developer local development. Uses SQLite for simplicity.

profile:
  env: development
  mode: demo
  seed_demo_data: true
  debug: true

database:
  url: sqlite:///./local.db
  pool_size: 1
  max_overflow: 2

cookie:
  secure: false
  samesite: lax
  session_name: exec_session
  csrf_name: exec_csrf

worker:
  poll_seconds: 2.0
  lease_seconds: 60
  heartbeat_seconds: 15
  job_max_attempts: 3
  retry_base_seconds: 5.0
  retry_max_seconds: 300.0

api:
  prefix: /api/v1
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  trusted_hosts:
    - localhost
    - 127.0.0.1
  # expected_alembic_revision: <populated by generate-configs.sh in Phase 1 completion>
