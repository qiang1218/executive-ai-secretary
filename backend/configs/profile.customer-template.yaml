# Customer template environment profile
# Phase 1: skeleton only. Used when delivering the product to a customer.
# Requires production-mode settings (no demo seed).

profile:
  env: customer-template
  mode: production
  seed_demo_data: false
  debug: false

database:
  url: postgresql+psycopg://executive_ai:CHANGEME@postgres:5432/executive_ai
  pool_size: 10
  max_overflow: 20

cookie:
  secure: true
  samesite: strict
  session_name: exec_session
  csrf_name: exec_csrf

worker:
  poll_seconds: 2.0
  lease_seconds: 60
  heartbeat_seconds: 15
  job_max_attempts: 3
  retry_base_seconds: 5.0
  retry_max_seconds: 300.0

api:
  prefix: /api/v1
  cors_allowed_origins:
    - https://CHANGEME.example.com
  trusted_hosts:
    - CHANGEME.example.com
    - api.CHANGEME.example.com
  # expected_alembic_revision: <populated by generate-configs.sh in Phase 1 completion>
