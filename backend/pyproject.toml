[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "executive-ai-api"
version = "0.1.0"
description = "Production API for the Executive AI Researcher workspace"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "croniter>=6,<7",
  "cryptography>=46.0.7,<49",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "orjson>=3.10,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0.37,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]  # aiosqlite / asyncpg / psycopg 已放入主依赖；测试 dev 仅保留 pytest 系列与 ruff
# embedded 模式：worker 进程内直接 import hermes-runtime 调用，需要 hermes-agent。
# hermes-runtime 本身的代码通过 sys.path 注入加载，无需作为包安装。
# 安装方式：uv sync --extra hermes
# mcp：hermes-agent 0.19.0 把 mcp 客户端 SDK 放在 [mcp] extra 里，
# 不装则 import mcp 失败 → register_mcp_servers 静默跳过 → LLM 拿不到工具。
hermes = [
  "hermes-agent==0.19.0",
  "mcp>=1.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/api",
  "src/configs",
  "src/core",
  "src/db",
  "src/exceptions",
  "src/logs",
  "src/middleware",
  "src/models",
  "src/repositories",
  "src/schemas",
  "src/services",
  "src/utils",
  "src/worker",
]


[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "postgres: requires a real PostgreSQL database and exercises database concurrency semantics",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP007", "UP035"]
"tests/*.py" = ["S105", "S106"]
"tests/conftest.py" = ["E402", "S105", "S106"]
