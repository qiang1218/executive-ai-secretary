# ============================================================
# Executive AI Secretary — Docker Compose
# ============================================================
# 首次启动（含初始化）：
#   1. cp .env.docker.example .env  并填入真实密钥
#   2. docker compose up -d db      等 db healthy
#   3. docker compose run --rm init 跑迁移 + 建企业 + 建用户
#   4. docker compose up -d         启动全部服务
#
# 日常启动：docker compose up -d
# 查看日志：docker compose logs -f
# 停止：docker compose down
# 重新构建：docker compose build
#
# 目录约定（相对于 docker-compose.yml 所在位置）：
#   ../frontend        前端源码
#   ../backend         后端源码（api + worker 共用同一镜像，通过 SERVICE_ROLE 切换）
# ============================================================

x-env-app: &env-app
  # 必须用 asyncpg（异步驱动）：API 异步引擎直接使用此 URL；
  # 同步链路（alembic / worker / seed）由 db.session._to_sync_url 自动转为 psycopg
  DATABASE_URL: postgresql+asyncpg://executive_ai:${DB_PASSWORD:-executive_ai_dev_2026}@db:5432/executive_ai
  APP_ENV: ${APP_ENV:-production}
  APP_MODE: ${APP_MODE:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 文件存储根目录（上传文件落盘位置，api 与 worker 共享同一卷）
  FILE_STORAGE_ROOT: /app/runtime/files
  # HERMES_HOME：skill 文件释放目录，api 写入、worker 读取，必须共享同一卷
  # hermes-agent 从 <HERMES_HOME>/skills/<slug>/SKILL.md 加载
  HERMES_HOME: /app/runtime/skills_active
  FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
  FILE_ENCRYPTION_KEY_VERSION: ${FILE_ENCRYPTION_KEY_VERSION:-v1}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
  INTEGRATION_ENCRYPTION_KEY_VERSION: ${INTEGRATION_ENCRYPTION_KEY_VERSION:-v1}
  SESSION_SECRET: ${SESSION_SECRET}
  CSRF_SECRET: ${CSRF_SECRET}
  AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
  AUDIT_HMAC_KEY_VERSION: ${AUDIT_HMAC_KEY_VERSION:-v1}
  AUDIT_HMAC_LEGACY_KEY_VERSION: ${AUDIT_HMAC_LEGACY_KEY_VERSION:-v1}
  CAPABILITY_HMAC_KEY: ${CAPABILITY_HMAC_KEY}

services:
  # ─── 数据库 (PostgreSQL 16 + pgvector) ─────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: executive-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: executive_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-executive_ai_dev_2026}
      POSTGRES_DB: executive_ai
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executive_ai -d executive_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── 后端 API ──────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: executive-ai-backend
    container_name: executive-ai-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env-app
      SERVICE_ROLE: api
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # API 通过该地址调用 worker 的 /v1/chat/completions / /v1/profile/run
      WORKER_BASE_URL: http://worker:8001
      HERMES_MAX_CONCURRENT_RUNS: ${HERMES_MAX_CONCURRENT_RUNS:-2}
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-10}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-120}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # api 与 worker 共享 runtime 卷：
      # - /app/runtime/files：上传文件落盘
      # - /app/runtime/skills_active：HERMES_HOME，api 写入 skill、worker 读取
      - runtime_data:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Worker（FastAPI 应用，与 api 共用镜像，SERVICE_ROLE=assistant_worker）─
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: executive-ai-backend
    container_name: executive-ai-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env-app
      SERVICE_ROLE: assistant_worker
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "8001"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      HERMES_MAX_CONCURRENT_RUNS: ${HERMES_MAX_CONCURRENT_RUNS:-2}
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-10}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-120}
    # worker.app:app 由 uvicorn 直接启动；监听容器内 8001
    command: ["uvicorn", "worker.app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    expose:
      - "8001"
    volumes:
      # 与 api 共享 runtime 卷：
      # - /app/runtime/files：上传文件读取
      # - /app/runtime/skills_active：HERMES_HOME，读取 api 写入的 skill 文件
      - runtime_data:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── 前端 vinext ──────────────────────────────────────────
  frontend-vinext:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      target: runner
      args:
        # 构建期注入：让前端走相对路径 /api/v1，由 nginx 反代到 api
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_APP_MODE: ${APP_MODE:-production}
    image: executive-ai-frontend-vinext
    container_name: executive-ai-frontend-vinext
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    expose:
      - "3001"

  # ─── 前端 nginx (对外入口) ────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      target: final
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_APP_MODE: ${APP_MODE:-production}
    image: executive-ai-frontend
    container_name: executive-ai-frontend
    restart: unless-stopped
    depends_on:
      - frontend-vinext
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # ─── 一次性初始化（迁移 + 建企业 + 建用户）─────────────────
  # 复用 api 镜像，覆盖 entrypoint
  # 用法：docker compose run --rm init
  init:
    image: executive-ai-backend
    container_name: executive-ai-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env-app
      SERVICE_ROLE: api
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      API_PORT: ${API_PORT:-8000}
    entrypoint: ["bash", "/app/deploy/init-seed.sh"]
    profiles:
      - init

volumes:
  db_data:
    driver: local
  # api 与 worker 共享的运行时卷：
  # - files/：上传文件落盘（api 写、worker 读）
  # - skills_active/：HERMES_HOME（api 写、worker 通过 hermes-agent 读）
  runtime_data:
    driver: local
